[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digitalisierer"
version = "0.1.0"
description = "Local-first workbench for scanning, OCR, transcription and reproducible digitization workflows."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["digitization", "ocr", "transcription", "scanner", "local-first"]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8,<10",
]

[project.scripts]
digitalisierer = "digitalisierer.cli:main"

[project.urls]
Homepage = "https://github.com/heimgewebe/digitalisierer"
Repository = "https://github.com/heimgewebe/digitalisierer"
Issues = "https://github.com/heimgewebe/digitalisierer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
